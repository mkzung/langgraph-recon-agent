[project]
name = "langgraph-recon-agent"
version = "0.1.0"
description = "Reconcile broker fills against a trade ledger with a LangGraph supervisor that routes each break to a specialist and escalates what it cannot explain."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["langgraph>=1.0"]

[project.optional-dependencies]
llm = ["langchain-core>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langgraph_recon_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
